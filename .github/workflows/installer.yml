name: Windows installer

# Builds TokenSafe-Setup-<version>.exe on windows-latest and attaches it to the
# GitHub release for the tag. The .exe is a per-user Inno Setup installer that
# bundles the engine tree and provisions the pinned CPython itself, so it needs
# neither Python, Node nor Git Bash on the target machine.
#
# Signing is conditional: without the secrets below the .exe is still built and
# uploaded, but SmartScreen will warn about an unknown publisher.
#
# Required for signed builds (Azure Trusted Signing; identity validation of the
# legal entity is a prerequisite on the Azure side):
#   AZURE_CLIENT_ID  AZURE_TENANT_ID  AZURE_SUBSCRIPTION_ID   app registration
#        federated to this repo's `Windows installer` environment (OIDC, no secret)
#   AZURE_TS_ENDPOINT   e.g. https://eus.codesigning.azure.net
#   AZURE_TS_ACCOUNT    Trusted Signing account name
#   AZURE_TS_PROFILE    certificate profile name
# The app needs the "Trusted Signing Certificate Profile Signer" role on the
# account, and the profile's identity validation must already be completed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-exe:
    name: Build the .exe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve the version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version: $version"

      # The bootstrapper is the risky part (download, SHA-256 pin, extraction,
      # cryptography), so it runs before packaging: a broken bootstrap fails the
      # job instead of shipping an .exe that cannot install anything.
      - name: Smoke-test the bootstrapper
        shell: pwsh
        env:
          TOKENSAFE_FORCE_MANAGED_RUNTIME: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $tsHome = Join-Path $env:RUNNER_TEMP 'ts-home'
          & (Join-Path $PWD 'installer\bootstrap.ps1') -AppDir $PWD.Path -Mode SmokeTest -TokenSafeHome $tsHome
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited with $LASTEXITCODE" }

          $shim = Join-Path $PWD 'bin\tokensafe.cmd'
          if (-not (Test-Path $shim)) { throw 'bootstrap.ps1 did not create bin\tokensafe.cmd' }
          $out = & $shim --version
          Write-Host $out
          if ($out -notmatch 'TokenSafe v') { throw 'the shim could not run the CLI' }

          $runtime = Get-ChildItem -Path (Join-Path $tsHome 'runtime') -Directory
          if (-not $runtime) { throw 'no managed runtime directory' }
          if (-not (Test-Path (Join-Path $runtime[0].FullName '.complete'))) { throw 'the runtime is not marked complete' }
          Remove-Item -Path (Join-Path $PWD 'bin\tokensafe.cmd') -Force
          Remove-Item -Path (Join-Path $PWD 'bin\agy-tokens.cmd') -Force -ErrorAction SilentlyContinue

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceRoot=$($PWD.Path)" "/DOutputDir=$($PWD.Path)\installer-output" 'installer\tokensafe.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem 'installer-output'

      - name: Detect signing credentials
        shell: pwsh
        run: |
          if ('${{ secrets.AZURE_CLIENT_ID }}' -and '${{ secrets.AZURE_TS_PROFILE }}') {
            "HAS_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host 'signing credentials found'
          } else {
            Write-Host '::warning::no Azure Trusted Signing credentials — the .exe will be unsigned (SmartScreen will warn)'
          }

      - name: Azure login (OIDC)
        if: env.HAS_SIGNING == '1'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the installer
        if: env.HAS_SIGNING == '1'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\installer-output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        if: env.HAS_SIGNING == '1'
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'installer-output\*.exe' | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $exe.FullName
          Write-Host "$($exe.Name): $($signature.Status) / $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "signature status is $($signature.Status)" }

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokensafe-windows-installer
          path: installer-output/*.exe
          if-no-files-found: error

      # The .exe itself has to be exercised on Windows: silent install (the
      # bootstrap provisions the runtime and writes the shim), run the installed
      # CLI, then uninstall and prove the PATH entry is gone again.
      - name: Install, run and uninstall the built installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem 'installer-output\*.exe' | Select-Object -First 1).FullName
          $setupLog = Join-Path $env:RUNNER_TEMP 'tokensafe-setup.log'
          $proc = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$setupLog"
          )
          if ($proc.ExitCode -ne 0) { Get-Content $setupLog -Tail 80; throw "installer exited $($proc.ExitCode)" }

          $cmd = Join-Path $env:LOCALAPPDATA 'Programs\TokenSafe\bin\tokensafe.cmd'
          if (-not (Test-Path $cmd)) { Get-Content $setupLog -Tail 80; throw "no shim at $cmd" }
          $out = & $cmd --version
          Write-Host $out
          if ($out -notmatch 'TokenSafe v') { throw 'the installed CLI did not run' }

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike '*\TokenSafe\bin*') { throw "PATH entry missing after install: $userPath" }

          $uninstall = Join-Path $env:LOCALAPPDATA 'Programs\TokenSafe\unins000.exe'
          & $uninstall /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          Start-Sleep -Seconds 5
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -like '*\TokenSafe\bin*') { throw "PATH entry survived uninstall: $userPath" }

      # release.yml creates the release for the tag; a separate workflow can get
      # there first, so retry instead of assuming the release exists.
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem 'installer-output\*.exe' | Select-Object -First 1).FullName
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME $exe --clobber
              if ($LASTEXITCODE -eq 0) { Write-Host "uploaded $exe"; exit 0 }
            }
            Write-Host "attempt $attempt/20: release $env:GITHUB_REF_NAME not ready yet"
            Start-Sleep -Seconds 30
          }
          throw "release $env:GITHUB_REF_NAME was not available for the installer upload"
