name: Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover tests

  # The managed CPython provisioner was only ever exercised on darwin-arm64 when
  # it shipped: this job runs it end to end on the platforms users actually
  # install on. TOKENSAFE_FORCE_MANAGED_RUNTIME hides the runner's own CPython, so
  # the download, the SHA-256 pin, the extraction layout and the dependency probe
  # all have to work before `tokensafe` prints anything.
  managed-runtime:
    name: Managed CPython (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Provision the pinned runtime and run the CLI on it
        shell: bash
        env:
          TOKENSAFE_FORCE_MANAGED_RUNTIME: "1"
          TOKENSAFE_HOME: ${{ runner.temp }}/tokensafe-home
        run: |
          set -euo pipefail
          out=$(node bin/tokensafe.js --version)
          printf '%s\n' "$out"
          # Reaching the CLI at all means the archive was downloaded, its SHA-256
          # matched the pin, it extracted into the expected layout and the runtime
          # answered a dependency probe. Pin that down so a silent fallback to a
          # broken interpreter cannot pass.
          printf '%s' "$out" | grep -q "TokenSafe v" || { echo "::error::the managed runtime did not run the CLI"; exit 1; }
          ls -d "$TOKENSAFE_HOME"/runtime/*/ >/dev/null || { echo "::error::no managed runtime directory"; exit 1; }
          test -f "$TOKENSAFE_HOME"/runtime/*/.complete || { echo "::error::the managed runtime is not marked complete"; exit 1; }

  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify CLI Syntax
        run: |
          node -c bin/tokensafe.js

      # `help` is forwarded to src/cli.py:_print_help(), so a command that ships
      # in the dispatcher can never be missing from the npm help screen again.
      - name: Verify help matches the dispatcher
        run: |
          out=$(node bin/tokensafe.js --help)
          printf '%s\n' "$out" | head -5
          for cmd in "dev [dir]" "inject [status|apply|revert]" "adapters [list]" "bench-oumv"; do
            printf '%s\n' "$out" | grep -qF "$cmd" || { echo "::error::tokensafe help is missing: $cmd"; exit 1; }
          done
