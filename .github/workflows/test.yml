name: Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover tests

  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify CLI Syntax
        run: |
          node -c bin/tokensafe.js

      # `help` is forwarded to src/cli.py:_print_help(), so a command that ships
      # in the dispatcher can never be missing from the npm help screen again.
      - name: Verify help matches the dispatcher
        run: |
          out=$(node bin/tokensafe.js --help)
          printf '%s\n' "$out" | head -5
          for cmd in "dev [dir]" "inject [status|apply|revert]" "adapters [list]" "bench-oumv"; do
            printf '%s\n' "$out" | grep -qF "$cmd" || { echo "::error::tokensafe help is missing: $cmd"; exit 1; }
          done
