name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_ref:
        description: 'Tag to backfill to PyPI (e.g. v4.7.1). Leave empty to run the npm/GitHub release flow.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    # A dispatch with publish_ref is a PyPI backfill only: it must not re-run npm
    # (whose registry-verify step waits up to 65 minutes for the validation queue)
    # or touch an existing GitHub release.
    if: github.event_name == 'push' || inputs.publish_ref == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python3 -m unittest discover tests

      - name: Strip bytecode before packaging
        # `npm pack` honours package.json "files", and negations there ("!**/*.pyc")
        # do not exclude anything. The test run above byte-compiles hooks/ and src/,
        # so without this the tarball ships stale .pyc files.
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo "remaining pyc: $(find . -name '*.pyc' | wc -l)"

      - name: Verify version consistency
        run: python3 scripts/release.py verify

      - name: Syntax-check CLI entrypoints
        run: |
          node -c bin/tokensafe.js
          python3 -m py_compile bin/tokensafe

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          OUTPUT=$(npm publish --access public --no-git-tag-version 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          # Idempotent reruns: a version already published (or staged by npm's
          # validation queue) must not fail a tag-triggered release.
          if echo "$OUTPUT" | grep -qE 'E409|EPUBLISHCONFLICT|Cannot publish over'; then
            echo "::warning::Version already published or staged on npm — treating as idempotent success."
            exit 0
          fi
          exit $STATUS

      - name: Verify the version is actually installable
        # `npm publish` can exit 0 with "your package is being processed" while the
        # version stays invisible for a long time (npm's async validation queue:
        # 4.6.2 took 55 minutes, 4.6.3 was reported green to GitHub while npm had
        # nothing). Wait up to ~65 minutes, then fail the tag so a release can never
        # be "green" without an installable artifact.
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          for i in $(seq 1 26); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/tokensafe/${VERSION}?t=$(date +%s)")
            if [ "$CODE" = "200" ]; then
              echo "tokensafe@${VERSION} is available on npm."
              exit 0
            fi
            echo "attempt ${i}/26: registry HTTP ${CODE} for tokensafe@${VERSION} (npm validation queue)"
            sleep 150
          done
          echo "::error::tokensafe@${VERSION} is not visible on the npm registry after ~65 minutes."
          echo "If the publish is staged, approve it on npmjs.com (package → pending publish) or rerun with an OTP."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  pypi:
    # PyPI via Trusted Publishing (OIDC): no token and no secret in this repo.
    # The publisher configured on pypi.org for project `tokensafe` must name this
    # repository (tokensafe-dev/tokensafe), this workflow file (release.yml) and the
    # `pypi` environment; a mismatch is rejected at the OIDC exchange, before upload.
    # `publish_ref` exists so a release that missing PyPI can be backfilled from the
    # tagged tree without re-publishing npm or moving the tag.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_ref != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tokensafe/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # skip-existing keeps re-runs and tag backfills idempotent.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
