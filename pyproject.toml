[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensafe"
version = "4.7.15"
description = "Your AI agent is smart enough to code all day. Now it actually can. Local runtime firewall & zero-loss context optimizer for AI coding agents."
readme = "README.md"
authors = [
    { name = "TokenSafe Team", email = "support@tokensafe.dev" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "ai",
    "llm",
    "tokens",
    "token-optimization",
    "context-window",
    "cursor",
    "claude",
    "antigravity",
    "codex",
    "mcp",
    "mcp-server",
    "ast",
    "proxy",
    "jwt",
    "ed25519",
    "zero-trust"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
# Required: cryptography. Everything below it is optional at runtime
# (tree-sitter grammars -> src/treesitter_backend.py stdlib fallback,
# Pillow -> macOS sips), but stays in the default install so
# `pip install tokensafe` ships the complete tool.
dependencies = [
    "cryptography>=42.0",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-php",
    "tree-sitter-kotlin",
    "tree-sitter-c-sharp",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-swift",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://tokensafe.dev"
Repository = "https://github.com/tokensafe-dev/tokensafe"
Documentation = "https://tokensafe.dev"
Issues = "https://github.com/tokensafe-dev/tokensafe/issues"

[project.scripts]
tokensafe = "src.cli:main"
tokensafe-proxy = "src.proxy:main"
tokensafe-mcp = "src.mcp_server:main"
tokensafe-stats = "src.dashboard:main"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["src.cloud_backend*", "src.cloud*", "src.mailer*", "src.weekly_digest*"]
